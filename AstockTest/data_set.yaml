qlib_init:
  provider_uri: "~/.qlib/qlib_data/my_data_2019"
  region: cn
market: &market all
benchmark: &benchmark "SH000300"
data_handler_config: &data_handler_config
  start_time: 2024-01-01
  end_time: 2025-09-25
  fit_start_time: 2024-01-01
  fit_end_time: 2025-09-25
  instruments: *market
  infer_processors:
      # - class: FilterCol
      #   kwargs:
      #       fields_group: feature
      #       col_list: ["RESI5", "WVMA5", "RSQR5", "KLEN", "RSQR10", "CORR5", "CORD5", "CORR10", 
      #                     "ROC60", "RESI10", "VSTD5", "RSQR60", "CORR60", "WVMA60", "STD5", 
      #                     "RSQR20", "CORD60", "CORD10", "CORR20", "KLOW"
      #                 ]
      # - class: RobustZScoreNorm
      #   kwargs:
      #       fields_group: feature
      #       clip_outlier: true
      - class: Fillna
        kwargs:
            fields_group: feature
  #learn_processors:

  #     - class: DropnaLabel
  #     - class: CSRankNorm
  #       kwargs:
  #           fields_group: label
  label: ["(Ref($close, -2) / Ref($close, -1) - 1)>0.1"] 
 
task:  
  dataset:
      class: NormalizedTSDatasetH
      module_path: qlib.data.dataset
      kwargs:
          handler:
              class: Alpha5
              module_path: qlib.contrib.data.handler
              kwargs: *data_handler_config
          segments:
              train: [2024-01-01, 2024-12-31]
              valid: [2025-06-01, 2025-09-30]
              test: [2025-01-01, 2025-06-01]
          step_len: 10